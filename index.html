<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: -apple-system, sans-serif; background: #f3f0f7; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #chat { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { 
            max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 16px; 
            line-height: 1.5; word-wrap: break-word; box-shadow: 0 2px 5px rgba(106, 27, 154, 0.1);
        }
        .others { 
            align-self: flex-start; background: white; color: #4a148c; 
            border: 1px solid #e1bee7; border-bottom-left-radius: 4px; 
        }
        .mine { 
            align-self: flex-end; background: linear-gradient(135deg, #7b1fa2, #4a148c); 
            color: white; border-bottom-right-radius: 4px; 
        }

        #form-container { 
            background: white; padding: 10px; display: flex; align-items: center;
            border-top: 1px solid #e1bee7; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        input { 
            flex: 1; border: 1px solid #e1bee7; background: #fcfaff; padding: 12px 18px; 
            border-radius: 25px; outline: none; font-size: 16px; color: #4a148c;
        }
        button { 
            margin-left: 10px; border: none; background: #9c27b0; color: white; 
            padding: 10px 20px; border-radius: 25px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="chat"></div>
    <form id="form-container">
        <input id="m" autocomplete="off" placeholder="输入消息..." />
        <button type="submit">发送</button>
    </form>

    <script src="
                  https://cdn.socket.io/4.7.2/socket.io.min.js
                  "></script>
    <script>
        const socket = io('https://后端地址.com'); 

        const form = document.getElementById('form-container');
        const input = document.getElementById('m');
        const box = document.getElementById('chat');
        const myId = Math.random().toString(36).substring(7);

        form.onsubmit = (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat', { id: myId, text: input.value });
                input.value = '';
            }
        };

        socket.on('chat', (data) => {
            const div = document.createElement('div');
            div.className = 'msg ' + (
                  data.id
                   === myId ? 'mine' : 'others');
            div.textContent = data.text;
            box.appendChild(div);
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        });
    </script>
</body>
</html>
